name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The kernels are compiled here, once, so the wheel carries them; nvcc is
  # needed, a GPU is not. CUDA 12.9 is the oldest toolkit that targets sm_100a,
  # and the runtime is linked statically, so its minimum driver becomes every
  # user's.
  wheel:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.9.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv patchelf
          python3 -m pip install --upgrade pip build auditwheel
      - run: python3 -m build --wheel
      - name: Show what the libraries link
        run: |
          for so in $(find build -name '*.so'); do
            echo "== $so"; readelf -d "$so" | grep NEEDED
          done
      # libcuda comes from the user's driver and must stay external.
      - name: Retag for manylinux
        run: |
          python3 -m auditwheel repair \
            --plat manylinux_2_35_x86_64 \
            --exclude libcuda.so.1 \
            --wheel-dir dist-manylinux dist/*.whl
          rm dist/*.whl
          mv dist-manylinux/*.whl dist/
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/

  # A source distribution for anyone on another CUDA or editing kernels: it
  # ships no libraries and compiles on first use.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: OPENGEMM_SKIP_KERNELS=1 python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  publish:
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
