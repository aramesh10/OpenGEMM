name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.9.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install python and the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv
          # patchelf from pip, not apt: 22.04 ships 0.14.3 and auditwheel
          # repair needs >= 0.14.5.
          python3 -m pip install --upgrade pip build auditwheel patchelf
      - run: python3 -m build --wheel
      - name: Show what the libraries link
        run: |
          for so in $(find build -name '*.so'); do
            echo "== $so"; readelf -d "$so" | grep NEEDED
          done
      - name: Retag for manylinux
        run: |
          python3 -m auditwheel repair \
            --plat manylinux_2_35_x86_64 \
            --exclude libcuda.so.1 \
            --wheel-dir wheelhouse dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: wheelhouse/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: OPENGEMM_SKIP_KERNELS=1 python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/

  release:
    needs: [wheel, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish:
    needs: [wheel, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
